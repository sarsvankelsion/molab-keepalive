name: Molab 24/7 Cloud Controller

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check active controller shift
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          CUR_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          OTHER_IDS=$(gh api "repos/${REPO}/actions/workflows/keepalive.yml/runs?status=in_progress" \
            --jq ".workflow_runs[] | select(.id != ${CUR_RUN_ID}) | .id" || true)
          if [ -n "$OTHER_IDS" ]; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              echo "Another controller shift is already active ($OTHER_IDS); skipping scheduled watchdog."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              for rid in $OTHER_IDS; do
                echo "Canceling previous run $rid..."
                gh run cancel "$rid" || true
              done
              sleep 5
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & Playwright Chromium
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install playwright paramiko huggingface_hub
          playwright install --with-deps chromium

      - name: Run Molab 24/7 Keepalive & Telegram Bot
        if: steps.guard.outputs.skip != 'true'
        env:
          MOLAB_CLOUD_CONTROLLER: "1"
          HF_STATE_TOKEN: ${{ secrets.HF_STATE_TOKEN }}
          HF_STATE_REPO: "lesslosster/molab-controller-state"
        run: |
          python keepalive.py --max-runtime-minutes 320

      - name: Trigger next 24/7 shift
        if: "${{ !cancelled() && steps.guard.outputs.skip != 'true' }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run keepalive.yml --repo "$REPO" --ref "${GITHUB_REF_NAME:-master}" || true
